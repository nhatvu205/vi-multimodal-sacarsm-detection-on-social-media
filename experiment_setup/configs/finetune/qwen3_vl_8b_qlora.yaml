extends: ../models/qwen3_vl_8b.yaml
experiment:
  name: qwen3_vl_8b_qlora
finetune:
  enabled: true
  scenario: s1
  output_subdir: finetune
  use_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: float16
  freeze_vision_tower: true
  train_mm_projector: true
  learning_rate: 2.0e-4
  num_train_epochs: 2
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  weight_decay: 0.0
  warmup_ratio: 0.03
  logging_steps: 10
  save_strategy: epoch
  eval_strategy: epoch
  save_total_limit: 2
  gradient_checkpointing: true
  max_length: 1024
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - up_proj
    - down_proj
    - gate_proj
