extends: ../models/llava_next_mistral_7b.yaml
experiment:
  name: llava_next_mistral_7b_qlora
prompt:
  system: |
    You are annotating Vietnamese multimodal sarcasm.
    Use only the given text and image.
    Predict three binary labels:
    - T: sarcasm from text alone
    - I: sarcasm from image alone
    - MM: sarcasm from the full post
    Return only one tuple in the format (T,I,MM).
  user_template: |
    Text:
    {text}
finetune:
  enabled: true
  scenario: s1
  output_subdir: finetune
  use_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: float16
  freeze_vision_tower: true
  train_mm_projector: false
  learning_rate: 2.0e-4
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  weight_decay: 0.0
  warmup_ratio: 0.03
  logging_steps: 10
  save_strategy: steps
  save_steps: 100
  eval_strategy: "no"
  save_total_limit: 1
  auto_resume: true
  gradient_checkpointing: true
  max_length: 1024
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - v_proj
