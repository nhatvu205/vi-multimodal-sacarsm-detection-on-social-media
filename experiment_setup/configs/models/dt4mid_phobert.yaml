extends: ../base.yaml
experiment:
  name: dt4mid_phobert_mm
model:
  key: dt4mid-phobert
  family: dt4mid_classifier
  pretrained_name: vinai/phobert-base
  vision_pretrained_name: google/vit-base-patch16-224-in21k
  projection_dim: 64
  hidden_dim: 32
  dropout: 0.3
  freeze_text_layers: 0
  freeze_vision_layers: 0
training:
  enabled: true
  epochs: 10
  batch_size: 8
  eval_batch_size: 16
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.0
  max_length: 128
  num_workers: 0
  gradient_clip_norm: 1.0
  early_stopping_patience: 2
  device: cuda
