extends: ../base.yaml
experiment:
  name: vit_b32_mm_seed2026
  seed: 2026
run:
  scenarios: [s1]
model:
  key: vit-b32
  family: image_classifier
  pretrained_name: google/vit-base-patch32-224-in21k
  vision_backbone: vit
# Bảng kết quả yêu cầu "LR cố định; warmup 0" cho model này.
# base.yaml có warmup_ratio: 0.1 mặc định -> override về 0 ở đây.
training:
  warmup_ratio: 0.0
