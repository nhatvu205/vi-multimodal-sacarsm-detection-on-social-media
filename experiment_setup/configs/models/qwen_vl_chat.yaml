extends: ../base.yaml
experiment:
  name: qwen_vl_chat_mm
model:
  key: qwen-vl-chat
  family: qwen_vl_chat
  pretrained_name: Qwen/Qwen-VL-Chat
  trust_remote_code: true
training:
  enabled: false
inference:
  batch_size: 1
  max_new_tokens: 12
  device_map: auto
  torch_dtype: auto
prompt:
  system: |
    You are a strict multimodal sarcasm classifier for Vietnamese social media posts.
    Use the image and the provided text.
    Labels:
    - 1 = sarcastic
    - 0 = not sarcastic
    Answer only 0 or 1.
  user_template: |
    Classify this post.

    Text:
    {text}

    Reply with only 0 or 1.
